name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must run before setup-node: `cache: pnpm` needs pnpm already on PATH.
      # No `version` input — the action reads packageManager from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # Browsers do not come from the pnpm store. Chromium only: one smoke on
      # one browser is the ratified scope (spec §8); a cross-browser matrix is
      # YAGNI for a portfolio piece.
      - run: pnpm exec playwright install --with-deps chromium

      # The spec's webServer runs `pnpm build` itself, so this rebuilds what
      # the `pnpm build` gate above already produced. Kept deliberately: the
      # build is a gate in its own right and must fail on its own line, and
      # one webServer command keeps local and CI on a single code path.
      - run: pnpm test:e2e
