name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must run before setup-node: `cache: pnpm` needs pnpm already on PATH.
      # No `version` input — the action reads packageManager from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # A no-op stub in chunk 01. It is wired now so that chunk 06 replaces a
      # script body instead of editing this workflow — editing a workflow renames
      # nothing here, but it is the classic way to silently break a required check.
      - run: pnpm test:e2e
